name: Release

# Source-only releases: no compiled binaries are attached. Browser-assisted
# login runs Playwright under Node from the package's node_modules, which a
# single `bun build --compile` executable cannot carry. Install with
# `bun add -g github:axelpaul/abler-cli` instead.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Check tag matches package.json version
        run: |
          version=$(bun -e 'console.log(require("./package.json").version)')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Install or update: `bun add -g github:axelpaul/abler-cli#${{ github.ref_name }}`

            No prebuilt binaries: browser-assisted login needs Node.js and Playwright next to the CLI.
